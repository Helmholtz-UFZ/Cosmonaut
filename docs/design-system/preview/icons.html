<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bootstrap Icons used</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div class="cn-label-xs" style="margin-bottom:10px;">Bootstrap Icons · self-hosted from <span class="cn-mono">assets/bootstrap-icons.min.css</span></div>
<div style="display:grid; grid-template-columns:repeat(8, 1fr); gap:14px 18px; font-size:24px; color:#2c3e50;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-book"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">book</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-journal-text"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">journal-text</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-cpu"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">cpu</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-list-task"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">list-task</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-rocket-takeoff"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">rocket-takeoff</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-arrow-left-circle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">arrow-left-circle</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-arrow-right-circle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">arrow-right-circle</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-upload"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">upload</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-trash"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">trash</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-eraser"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">eraser</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-recycle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">recycle</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-arrow-counterclockwise"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">arrow-ccw</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-arrow-clockwise"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">arrow-cw</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-exclamation-triangle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">exclamation</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-info-circle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">info-circle</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-shield-check"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">shield-check</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-play"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">play</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-download"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">download</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-check-circle-fill"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">check-fill</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-x-circle"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">x-circle</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-layers"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">layers</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-arrows-fullscreen"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">fullscreen</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-gear"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">gear</span></div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><i class="bi bi-funnel"></i><span style="font-size:9px; color:var(--cn-fg-muted); font-family:var(--cn-font-mono);">funnel</span></div>
</div>
</body>
</html>
