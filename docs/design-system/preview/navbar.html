<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navbar</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_flatly.css">
</head>
<body style="margin:0; padding:24px; background:#ecf0f1;">
<nav style="background:#2c3e50; color:#fff; padding:8px 24px; display:flex; align-items:center; gap:32px; border-radius:6px;">
  <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px;">
    <img src="../assets/logo.svg" alt="" width="28" height="28" style="filter:invert(1);">
    <span>COSMONAUT</span>
  </div>
  <div style="display:flex; gap:22px; font-size:14px;">
    <span><i class="bi bi-book" style="margin-right:4px;"></i>Documentation</span>
    <span><i class="bi bi-journal-text" style="margin-right:4px;"></i>Logs</span>
    <span><i class="bi bi-cpu" style="margin-right:4px;"></i>Worker manager</span>
    <span><i class="bi bi-list-task" style="margin-right:4px;"></i>Job manager</span>
  </div>
</nav>
<div style="margin-top:10px; font-size:12px; color:var(--cn-fg-muted);">
  <span class="cn-mono">sticky-top · navbar-dark · bg-primary</span>  ·  30×30 logomark · 4 fixed nav items
</div>
</body>
</html>
