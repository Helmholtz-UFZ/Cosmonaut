<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:flex; flex-direction:column; gap:8px; font-size:12px;">
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="cn-mono cn-label-xs" style="width:48px;">m-1</span>
    <span style="background:#3498db; height:14px; width:4px; border-radius:1px;"></span>
    <span class="cn-mono" style="color:var(--cn-fg-muted);">0.25rem · 4px</span>
    <span style="color:var(--cn-fg-muted); margin-left:auto;">icon-to-label nudge</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="cn-mono cn-label-xs" style="width:48px;">m-2</span>
    <span style="background:#3498db; height:14px; width:8px; border-radius:1px;"></span>
    <span class="cn-mono" style="color:var(--cn-fg-muted);">0.5rem · 8px</span>
    <span style="color:var(--cn-fg-muted); margin-left:auto;">gap-2 between buttons</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="cn-mono cn-label-xs" style="width:48px;">m-3</span>
    <span style="background:#3498db; height:14px; width:16px; border-radius:1px;"></span>
    <span class="cn-mono" style="color:var(--cn-fg-muted);">1rem · 16px</span>
    <span style="color:var(--cn-fg-muted); margin-left:auto;">card outer margin (m-3)</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="cn-mono cn-label-xs" style="width:48px;">m-4</span>
    <span style="background:#3498db; height:14px; width:24px; border-radius:1px;"></span>
    <span class="cn-mono" style="color:var(--cn-fg-muted);">1.5rem · 24px</span>
    <span style="color:var(--cn-fg-muted); margin-left:auto;">card me-4 right margin</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="cn-mono cn-label-xs" style="width:48px;">m-5</span>
    <span style="background:#3498db; height:14px; width:48px; border-radius:1px;"></span>
    <span class="cn-mono" style="color:var(--cn-fg-muted);">3rem · 48px</span>
    <span style="color:var(--cn-fg-muted); margin-left:auto;">section break</span>
  </div>
</div>
</body>
</html>
