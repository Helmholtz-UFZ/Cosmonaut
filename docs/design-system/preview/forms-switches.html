<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Switches</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_flatly.css">
</head>
<body class="cn-card-host">
<div>
  <div class="cn-label-xs" style="margin-bottom:10px;">Road type filter · street_selection.py</div>
  <div style="display:grid; grid-template-columns:repeat(4, auto); gap:12px 26px; font-size:14px;">
    <label class="form-switch"><input type="checkbox"><span>Motorway</span></label>
    <label class="form-switch"><input type="checkbox"><span>Trunk road</span></label>
    <label class="form-switch"><input type="checkbox" checked><span>Primary road</span></label>
    <label class="form-switch"><input type="checkbox" checked><span>Secondary road</span></label>
    <label class="form-switch"><input type="checkbox" checked><span>Tertiary road</span></label>
    <label class="form-switch"><input type="checkbox"><span>Unclassified</span></label>
    <label class="form-switch"><input type="checkbox"><span>Residential</span></label>
    <label class="form-switch"><input type="checkbox"><span>Living street</span></label>
  </div>
</div>
</body>
</html>
