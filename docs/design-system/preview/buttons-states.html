<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons · sizes &amp; states</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_flatly.css">
</head>
<body class="cn-card-host">
<div style="display:flex; flex-direction:column; gap:12px;">
  <div style="display:flex; gap:8px; align-items:center;">
    <span class="cn-label-xs" style="width:72px;">Sizes</span>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <span class="cn-label-xs" style="width:72px;">Outline</span>
    <button class="btn btn-outline-primary">Refresh Jobs</button>
    <button class="btn btn-outline-secondary">Cancel</button>
    <button class="btn btn-outline-danger">Delete</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <span class="cn-label-xs" style="width:72px;">States</span>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary" style="background:#1c2833; border-color:#1c2833;">:hover</button>
    <button class="btn btn-primary" style="background:#172026; border-color:#172026; box-shadow:0 0 0 .25rem rgba(44,62,80,.25);">:focus</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>
</div>
</body>
</html>
