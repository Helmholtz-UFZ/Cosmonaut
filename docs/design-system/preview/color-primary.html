<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand color</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:flex; gap:18px; align-items:stretch; height:140px;">
  <div style="flex:1.4; background:#2c3e50; border-radius:8px; display:flex; align-items:flex-end; padding:14px 16px; color:#fff;">
    <div>
      <div style="font-weight:700; font-size:14px; letter-spacing:.02em;">Primary / Brand</div>
      <div class="cn-mono" style="opacity:.75; font-size:12px;">#2C3E50 · rgb(44, 62, 80)</div>
    </div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:8px; font-size:12px; color:var(--cn-fg-muted);">
    <div style="background:#2c3e50; color:#fff; padding:8px 10px; border-radius:6px; font-weight:600; font-size:13px;">Navbar · sticky-top</div>
    <button style="all:unset; background:#2c3e50; color:#fff; padding:9px 14px; border-radius:6px; font-weight:600; font-size:13px; text-align:center;">Primary button</button>
    <div style="padding:8px 10px; border:1px solid #2c3e50; border-radius:6px; color:#2c3e50; font-weight:600; font-size:13px; text-align:center;">Refresh Jobs (outline)</div>
  </div>
</div>
</body>
</html>
