<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neutrals</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:grid; grid-template-columns:repeat(9, 1fr); gap:6px;">
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#f8f9fa; border:1px solid #dee2e6; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">100</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">F8F9FA</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#ecf0f1; border:1px solid #dee2e6; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">200</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">ECF0F1</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#dee2e6; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">300</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">DEE2E6</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#ced4da; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">400</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">CED4DA</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#b4bcc2; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">500</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">B4BCC2</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#95a5a6; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700; color:#fff; mix-blend-mode:initial;">600</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">95A5A6</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#7b8a8b; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">700</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">7B8A8B</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#343a40; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">800</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">343A40</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="aspect-ratio:1; background:#212529; border-radius:6px;"></div>
    <div style="font-size:10px; font-weight:700;">900</div>
    <div class="cn-mono" style="font-size:9px; color:var(--cn-fg-muted);">212529</div>
  </div>
</div>
<div style="margin-top:12px; font-size:11px; color:var(--cn-fg-muted);">
  100 zebra rows · 200 app shell · 300 default borders · 600 secondary buttons + muted text · 700 .bg-dark · 900 body text
</div>
</body>
</html>
