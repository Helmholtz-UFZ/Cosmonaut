<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand illustration</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host" style="padding:18px 24px;">
<div style="display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:center;">
  <img src="../assets/front_banner.png" alt="Astronaut driving a UFZ research van across the Harz countryside" style="width:100%; height:auto; border-radius:8px; border:1px solid #dee2e6; display:block;">
  <div style="font-size:12px; color:var(--cn-fg-default); line-height:1.5;">
    <div class="cn-label-xs" style="margin-bottom:6px;">Brand illustration</div>
    <p style="margin:0 0 8px;">Cartoon astronaut + UFZ research van across rural Harz, comic-line + flat fill.</p>
    <p style="margin:0 0 8px; color:var(--cn-fg-muted);">The only narrative graphic in the system. Use sparingly: README, landing, 404.</p>
    <p style="margin:0; color:var(--cn-fg-muted);"><span class="cn-mono">front_banner.png · 1536 × 1024</span></p>
  </div>
</div>
</body>
</html>
