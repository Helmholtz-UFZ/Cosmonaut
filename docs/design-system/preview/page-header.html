<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page header banner</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_flatly.css">
</head>
<body class="cn-card-host" style="background:#fff;">
<div style="border:1px solid #212529; border-radius:6px; overflow:hidden;">
  <div style="background:#3498db; color:#fff; padding:14px 0; text-align:center;">
    <div style="font-size:28px; font-weight:500; line-height:1.2;">Job Manager</div>
    <div style="font-size:18px; font-weight:500; line-height:1.2; opacity:.95;">Centralized management of all COSMONAUT jobs</div>
  </div>
  <div style="background:#fff; padding:14px 16px; display:flex; justify-content:flex-end; gap:8px;">
    <button class="btn btn-warning btn-sm"><i class="bi bi-recycle"></i>Clean</button>
    <button class="btn btn-danger btn-sm"><i class="bi bi-trash"></i>Delete Selection</button>
    <button class="btn btn-primary btn-sm"><i class="bi bi-arrow-clockwise"></i>Refresh Jobs</button>
  </div>
</div>
</body>
</html>
