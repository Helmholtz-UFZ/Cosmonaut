<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons · main</title>
<link rel="stylesheet" href="../assets/bootstrap-icons.min.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_flatly.css">
</head>
<body class="cn-card-host">
<div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
  <button class="btn btn-primary"><i class="bi bi-rocket-takeoff"></i>Create new job</button>
  <button class="btn btn-primary"><i class="bi bi-arrow-right-circle"></i>Next</button>
  <button class="btn btn-primary"><i class="bi bi-arrow-left-circle"></i>Previous</button>
  <button class="btn btn-primary"><i class="bi bi-upload"></i>Upload membership file</button>
  <button class="btn btn-secondary">Cancel</button>
  <button class="btn btn-link">Show advanced options ▾</button>
</div>
<div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px;">
  <button class="btn btn-warning"><i class="bi bi-recycle"></i>Clean</button>
  <button class="btn btn-warning"><i class="bi bi-arrow-counterclockwise"></i>Reset Job</button>
  <button class="btn btn-danger"><i class="bi bi-trash"></i>Delete Selection</button>
  <button class="btn btn-danger"><i class="bi bi-trash"></i>Delete Membership</button>
  <button class="btn btn-danger"><i class="bi bi-eraser"></i>Remove clicked roads</button>
  <button class="btn btn-success"><i class="bi bi-play"></i>Submit Test Task</button>
</div>
</body>
</html>
