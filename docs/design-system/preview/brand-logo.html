<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo lockup</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:grid; grid-template-columns:auto auto auto 1fr; gap:24px; align-items:center;">
  <!-- on light -->
  <div style="background:#fff; border:1px solid #dee2e6; padding:18px 22px; border-radius:6px; display:flex; align-items:center; gap:10px;">
    <img src="../assets/logo.svg" alt="" width="36" height="36" style="filter:invert(20%) sepia(15%) saturate(900%) hue-rotate(180deg);">
    <span style="font-weight:700; font-size:20px; color:#2c3e50;">COSMONAUT</span>
  </div>
  <!-- on dark -->
  <div style="background:#2c3e50; padding:18px 22px; border-radius:6px; display:flex; align-items:center; gap:10px;">
    <img src="../assets/logo.svg" alt="" width="36" height="36" style="filter:invert(1);">
    <span style="font-weight:700; font-size:20px; color:#fff;">COSMONAUT</span>
  </div>
  <!-- mark only -->
  <div style="background:#fff; border:1px solid #dee2e6; padding:14px; border-radius:6px;">
    <img src="../assets/logo.svg" alt="" width="48" height="48" style="filter:invert(20%) sepia(15%) saturate(900%) hue-rotate(180deg);">
  </div>
  <div style="font-size:12px; color:var(--cn-fg-muted); line-height:1.5;">
    Folded-map mark + Lato 700 wordmark.<br>
    Mark is single-colour, inherits <span class="cn-mono">currentColor</span>.<br>
    No alt wordmark exists yet — request from brand if needed.
  </div>
</div>
</body>
</html>
