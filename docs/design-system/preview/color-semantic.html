<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Semantic colors</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;">
  <div style="background:#3498db; color:#fff; border-radius:8px; padding:14px 14px 12px;">
    <div style="font-weight:700; font-size:13px;">Info</div>
    <div class="cn-mono" style="font-size:11px; opacity:.8;">#3498DB</div>
    <div style="font-size:11px; margin-top:18px; opacity:.85;">Page-header banners</div>
  </div>
  <div style="background:#18bc9c; color:#fff; border-radius:8px; padding:14px 14px 12px;">
    <div style="font-weight:700; font-size:13px;">Success</div>
    <div class="cn-mono" style="font-size:11px; opacity:.8;">#18BC9C</div>
    <div style="font-size:11px; margin-top:18px; opacity:.85;">Links · Completed</div>
  </div>
  <div style="background:#f39c12; color:#fff; border-radius:8px; padding:14px 14px 12px;">
    <div style="font-weight:700; font-size:13px;">Warning</div>
    <div class="cn-mono" style="font-size:11px; opacity:.8;">#F39C12</div>
    <div style="font-size:11px; margin-top:18px; opacity:.85;">Reset · Pending</div>
  </div>
  <div style="background:#e74c3c; color:#fff; border-radius:8px; padding:14px 14px 12px;">
    <div style="font-weight:700; font-size:13px;">Danger</div>
    <div class="cn-mono" style="font-size:11px; opacity:.8;">#E74C3C</div>
    <div style="font-size:11px; margin-top:18px; opacity:.85;">Delete · Map streets</div>
  </div>
</div>
</body>
</html>
