<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="_card.css">
</head>
<body class="cn-card-host">
<div style="display:flex; gap:18px; align-items:flex-end;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:78px; height:78px; background:#ecf0f1; border:1px solid #dee2e6; border-radius:4px;"></div>
    <div class="cn-label-xs">sm · 4px</div>
    <div class="cn-mono" style="font-size:10px; color:var(--cn-fg-muted);">badges, FormText</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:78px; height:78px; background:#ecf0f1; border:1px solid #dee2e6; border-radius:6px;"></div>
    <div class="cn-label-xs">default · 6px</div>
    <div class="cn-mono" style="font-size:10px; color:var(--cn-fg-muted);">btn, input, card</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:78px; height:78px; background:#ecf0f1; border:1px solid #dee2e6; border-radius:8px;"></div>
    <div class="cn-label-xs">lg · 8px</div>
    <div class="cn-mono" style="font-size:10px; color:var(--cn-fg-muted);">modal, alert</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:78px; height:78px; background:#ecf0f1; border:1px solid #dee2e6; border-radius:16px;"></div>
    <div class="cn-label-xs">xl · 16px</div>
    <div class="cn-mono" style="font-size:10px; color:var(--cn-fg-muted);">avoid on chrome</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:120px; height:32px; background:#ecf0f1; border:1px solid #dee2e6; border-radius:50rem;"></div>
    <div class="cn-label-xs">pill · 50rem</div>
    <div class="cn-mono" style="font-size:10px; color:var(--cn-fg-muted);">status pill (rare)</div>
  </div>
</div>
</body>
</html>
