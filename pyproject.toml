[tool.poetry]
name = "ufz-flask"
version = "0.1.0"
description = "This is Poetry"
authors = ["Louis Ferdinand Trinkle <louis-ferdinand.trinkle@ufz.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.12"
blinker = "1.6.2"
click = "8.1.7"
flask = "2.3.3"
flask-wtf = "1.1.1"
itsdangerous = "2.1.2"
jinja2 = "3.1.2"
markupsafe = "2.1.3"
Werkzeug = "2.3.7"
WTForms = "3.0.1"
flask-bootstrap = "^3.3.7.1"
bootstrap-flask = "^2.3.2"
pyproj = "^3.6.1"
numpy = "^1.26.1"
shapely = "^2.0.2"
geojson = "^3.0.1"
overpass = "^0.7"
pandas = "^2.1.2"
plotly = "^5.18.0"
dash = "^2.14.1"
geopandas = "^0.14.1"
dash-leaflet = "^1.0.11"
pydantic = "^2.5.3"

[tool.poetry.group.dev.dependencies]
blinker = "1.6.2"
click = "8.1.7"
flask = "2.3.3"
flask-wtf = "1.1.1"
itsdangerous = "2.1.2"
jinja2 = "3.1.2"
markupsafe = "2.1.3"
Werkzeug = "2.3.7"
WTForms = "3.0.1"
flask-bootstrap = "^3.3.7.1"
bootstrap-flask = "^2.3.2"

[tool.poetry.group.test.dependencies]
pytest = "6.2.5"
pytest-mock = "3.6.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
