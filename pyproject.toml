[project]
name = "cosmonaut"
version = "0.2.1"
description = "Navigation route optimization for cosmic ray neutron sensor surveys"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    "dash>=3.2.0,<4",
    "dash-ag-grid>=32.0.0,<33",
    "dash-bootstrap-components>=2.0.3,<3",
    "dash-extensions>=2.0.0,<3",
    "dash-form-factory==0.1.7",
    "dash-leaflet>=1.1.3,<2",
    "email-validator>=2.3.0,<3",
    "gdal>=3.3.0,<4",
    "geopandas>=1.0.0,<2",
    "gpxpy>=1.6.0,<2",
    "gunicorn>=22.0.0,<24",
    "ijson>=3.5.0,<4",
    "matplotlib>=3.10.0,<4",
    "minio>=7.2.0,<8",
    "networkx>=3.4.0,<4",
    "orjson>=3.10.0,<4",
    "osmnx>=2.0.0,<3",
    "psycopg2>=2.9.10,<3",
    "pydantic>=2.12.0,<3",
    "pyproj>=3.7.0,<4",
    "python-dotenv>=1.1.0,<2",
    "qrcode[pil]>=7.4.0,<8",
    "rasterio>=1.4.0,<2",
    "requests>=2.32.0,<3",
    "sensor-routing==0.2.6",
    "shapely>=2.0.0,<3",
    "sqlalchemy>=2.0.40,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "ruff>=0.7.4",
]
docs = [
    "mkdocs>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmonaut_app"]

[tool.uv]
default-groups = [
    "dev"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]
