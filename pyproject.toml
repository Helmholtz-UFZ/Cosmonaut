[project]
name = "cosmonaut"
version = "0.3.2"
description = "Navigation route optimization for field survey campaigns, developed for cosmic ray neutron sensor (CRNS) surveys"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    # Shared Dash + Celery + PostgreSQL + MinIO framework, pinned to a frozen tag.
    # COSMOPOLITAN pins the same tag; a framework change is an MR + new tag there,
    # then both apps re-pin. Never edit the framework from an app repo.
    "cosmo-suite @ git+https://codebase.helmholtz.cloud/ufz/tb5-smm/met/wg7/cosmo-suite@v0.3.0",
    "dash>=3.2.0,<4",
    "dash-ag-grid>=32.0.0,<33",
    "dash-bootstrap-components>=2.0.3,<3",
    "dash-extensions>=2.0.0,<3",
    "dash-form-factory==0.1.7",
    "dash-leaflet>=1.1.3,<2",
    "email-validator>=2.3.0,<3",
    "gdal>=3.3.0,<4",
    "geopandas>=1.0.0,<2",
    "gpxpy>=1.6.0,<2",
    "gunicorn>=22.0.0,<24",
    "ijson>=3.5.0,<4",
    "matplotlib>=3.10.0,<4",
    "minio>=7.2.0,<8",
    "networkx>=3.4.0,<4",
    "orjson>=3.10.0,<4",
    "psycopg2>=2.9.10,<3",
    "pydantic>=2.12.0,<3",
    "pyproj>=3.7.0,<4",
    "python-dotenv>=1.1.0,<2",
    "qrcode[pil]>=7.4.0,<8",
    "rasterio>=1.4.0,<2",
    "requests>=2.32.0,<3",
    "sensor-routing==0.2.6",
    "shapely>=2.0.0,<3",
    "sqlalchemy>=2.0.40,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    # Upper bound on the minor: ruff changes rule behaviour in minor releases.
    # Keep in sync with .gitlab-ci.yml and .pre-commit-config.yaml.
    "ruff>=0.16.0,<0.17",
]
docs = [
    "mkdocs>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because cosmo-suite is a direct git reference, not a PyPI package.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cosmonaut_app"]

[tool.uv]
default-groups = [
    "dev"
]

[tool.ruff.lint]
# Explicit rule set instead of ruff's built-in defaults. Those defaults are not a
# stable contract: 0.16.0 grew them from 59 to 413 rules and simultaneously
# dropped 18 long-standing ones (E402, E711, E712, E731, E741, F403, …). Listing
# the set here decouples us from that in both directions — a ruff upgrade can no
# longer silently add or remove checks.
#   E4/E7/E9 + F : the pre-0.16 default set
#   I            : import sorting — ruff-format does not do this, nothing else did
#   UP           : pyupgrade, safe and auto-fixable on requires-python >= 3.13
# Deliberately not enabled yet: BLE, DTZ, SIM, S, RUF012. Each needs a per-site
# judgement call (is this `except Exception` justified? does this naive datetime
# matter?), so they belong in their own review, not in a lint-config change.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]
