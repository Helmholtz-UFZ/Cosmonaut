services:
  cosmonaut:
    image: cosmonaut
    container_name: cosmonaut
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
      args:
        - REQUIREMENTS_SHA=${REQUIREMENTS_SHA-}
    env_file: .env
    volumes:
      - "./:/python_docker/cosmonaut"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - ${FLASK_PORT}:${FLASK_PORT}

  postgres:
    image: postgres:17.5
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
      POSTGRES_DB: ${DB_NAME}
    container_name: postgres_cosmonaut
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7.4
    container_name: redis_cosmonaut
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}

  minio:
    image: minio/minio:latest
    container_name: minio_cosmonaut
    ports:
      - "9000:9000"
      - "9001:9001" # Web-based admin console
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      /usr/bin/mc mb myminio/${MINIO_BUCKET};
      /usr/bin/mc policy set public ${MINIO_BUCKET};
      exit 0;
      "