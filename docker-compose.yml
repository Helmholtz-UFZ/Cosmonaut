services:
  postgres:
    image: postgres:latest
    ports: 
      - ${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
      POSTGRES_DB: ${DB_NAME}
    container_name: postgres
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql