services:
  cosmonaut:
    image: cosmonaut
    container_name: cosmonaut
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    env_file: .env
    volumes:
      - "./:/python_docker/cosmonaut"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - ${FLASK_PORT}:${FLASK_PORT}

  postgres:
    image: postgres:17.3
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
      POSTGRES_DB: ${DB_NAME}
    container_name: postgres_cosmonaut
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7.4
    container_name: redis_cosmonaut
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}

  minio:
    image: minio/minio:latest
    container_name: minio_cosmonaut
    ports:
      - "9000:9000"
      - "9001:9001" # Web-based admin console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
