services:
  cosmonaut:
    image: cosmonaut
    container_name: cosmonaut
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    volumes:
      - "./:/python_docker/cosmonaut"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    network_mode: host
    depends_on:
      postgres:
        condition: service_started
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: cosmonaut-worker
    container_name: cosmonaut_worker
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    volumes:
      - "./:/python_docker/cosmonaut"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    network_mode: host
    depends_on:
      postgres:
        condition: service_started
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgis/postgis:latest
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres_cosmonaut
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: redis_cosmonaut
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes

  # S3 server for local runs, copied from cosmo-suite's
  # docs/conventions/object_storage.md (CI takes the same image from the
  # framework's ci/object-storage.gitlab-ci.yml).
  object-storage:
    image: rustfs/rustfs:1.0.0
    container_name: object_storage_cosmonaut
    ports:
      - "${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001" # Web console at /rustfs/console/
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  tileserver:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: cosmonaut-tileserver
    platform: linux/amd64
    ports:
      # Every host-published port reads ${<SERVICE>_HOST_PORT:-<default>}: host side
      # variable, container side fixed. With the variable unset the default applies,
      # so prod/CI/k8s see no change at all.
      # Local allocation across the three suites: ../cosmo-suite/docs/plan/local-port-allocation.md
      - "${TILESERVER_HOST_PORT:-8001}:80"
    volumes:
      - "./cosmonaut_app/work_dir:/data:ro"
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_INGESTED_BYTES_AT_OPEN: 32768
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_HTTP_MULTIPLEX: YES
      GDAL_HTTP_VERSION: 2
      VSI_CACHE: TRUE
      VSI_CACHE_SIZE: 5000000
