services:
  cosmonaut:
    image: cosmonaut
    container_name: cosmonaut
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    volumes:
      - "./:/python_docker/cosmonaut"
    env_file: .env
    user: "${DOCKER_UID}:${DOCKER_GID}"
    network_mode: host
    depends_on:
      - postgres
      - minio
      - redis

  worker:
    image: cosmonaut-worker
    container_name: cosmonaut_worker
    build:
      context: .
      dockerfile: ./docker/worker.Dockerfile
    volumes:
      - "./:/python_docker/cosmonaut"
    env_file: .env
    user: "${DOCKER_UID}:${DOCKER_GID}"
    depends_on:
      - postgres
      - minio
      - redis

  postgres:
    image: postgis/postgis:latest
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    container_name: postgres_cosmonaut
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: redis_cosmonaut
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: minio_cosmonaut
    ports:
      - "${OBJECT_STORAGE_PORT}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT}:9001" # Web-based admin console
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  tileserver:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: cosmonaut-tileserver
    platform: linux/amd64
    ports:
      - "8001:80"
    volumes:
      - "./cosmonaut_app/work_dir:/data:ro"
    environment:
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: 75%
      GDAL_INGESTED_BYTES_AT_OPEN: 32768
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_HTTP_MULTIPLEX: YES
      GDAL_HTTP_VERSION: 2
      VSI_CACHE: TRUE
      VSI_CACHE_SIZE: 5000000
