stages:
  - "lint"
  - "test"
  - "build"
  # - "deploy"

variables:
  POSTGRES_DB: cosmonaut_db
  POSTGRES_USER: cosmonaut
  POSTGRES_PASSWORD: password
  DB_HOST_NAME: postgres
  DB_NAME: cosmonaut_db
  DB_PORT: "5432"
  DB_USER: cosmonaut
  DB_PW: password

.docker_login: &docker_login
  - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'

.base_before_build_script:
  image: "docker:24-cli"
  services:
    - "docker:24-dind"
  tags:
    - "hifis"

linting:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "apt-get update && apt-get install -y libgdal-dev"
    - "export CPLUS_INCLUDE_PATH=/usr/include/gdal"
    - "export C_INCLUDE_PATH=/usr/include/gdal"
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run ruff check ."

testing:
  stage: "test"
  image: "python:3.13"
  services:
    - name: "postgis/postgis:latest"
      alias: "postgres"
  before_script:
    - "apt-get update && apt-get install -y libgdal-dev postgresql-client"
    - "export CPLUS_INCLUDE_PATH=/usr/include/gdal"
    - "export C_INCLUDE_PATH=/usr/include/gdal"
    - "pip install uv"
    - "uv sync"
    # Install Playwright browsers for headless testing
    - "uv run playwright install --with-deps chromium"
    # Wait for PostgreSQL to be ready
    - "until pg_isready -h postgres -p 5432 -U cosmonaut; do echo 'Waiting for PostgreSQL...'; sleep 2; done"
    # Initialize database schema
    - "PGPASSWORD=password psql -h postgres -U cosmonaut -d cosmonaut_db -f docker/init.sql"
    - "cp env_test .env"
  script:
    # Run all tests in headless mode (default)
    - "uv run pytest -v"

build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  script:
    - "docker build -t $CI_REGISTRY_IMAGE:latest -f docker/prod.Dockerfile ."
    - "docker push $CI_REGISTRY_IMAGE:latest"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

build-release:
  stage: "build"
  extends: ".base_before_build_script"
  script:
    - "docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG ."
    - "docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - 'echo -e "image:\n  tag: ${CI_COMMIT_TAG}" > values.yaml'
  artifacts:
    paths:
      - "values.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"
