stages:
  - "prepare"
  - "lint"
  - "test"
  - "build"
  - "deploy"

variables:
  # Postgres. POSTGRES_DB/USER/PASSWORD configure the service image; the app reads
  # the same names (they were POSTGRES_NAME/… before the cosmo_suite integration —
  # the framework's name won, which collapsed the former duplicate pair into one).
  POSTGRES_DB: cosmonaut_db
  POSTGRES_USER: cosmonaut
  POSTGRES_PASSWORD: password
  POSTGRES_HOST_NAME: postgres
  POSTGRES_PORT: "5432"
  # MinIO
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin
  # App config
  WEB_WORK_DIR: "./cosmonaut_app/work_dir"
  FLASK_PORT: "8080"
  REDIS_PORT: "6379"
  REDIS_HOST: "redis"
  DOCKER_UID: "1000"
  DOCKER_GID: "1000"
  GUNICORN: "0"
  FLASK_DEBUG: "0"
  # Enable BuildKit for better Docker layer caching
  DOCKER_BUILDKIT: "1"

.docker_login: &docker_login
  - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'

.base_before_build_script:
  image: "docker:29-cli"
  services:
    - "docker:29-dind"
  tags:
    - "hifis"

# Rebuilds the CI image only when the Dockerfile or Python deps change.
# On main, always runs to keep the image current. On feature branches, skipped
# unless ci.Dockerfile, pyproject.toml, or uv.lock changed — the existing
# ci:latest from main is used by the test jobs instead.
# --build-arg BUILDKIT_INLINE_CACHE=1 embeds cache metadata in the pushed image
# so future --cache-from runs get proper layer hits.
build-ci-image:
  stage: "prepare"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    - docker pull "${CI_REGISTRY_IMAGE}/ci:latest" || true
    - >
      docker build
      --cache-from "${CI_REGISTRY_IMAGE}/ci:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "${CI_REGISTRY_IMAGE}/ci:latest"
      -f docker/ci.Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/ci:latest"
  rules:
    # Nightly rebuild ships prod images from scratch — it doesn't use ci:latest,
    # so don't rebuild the CI image on the schedule.
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
      when: "never"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - docker/ci.Dockerfile
        - pyproject.toml
        - uv.lock
    - when: "never"

# Ruff is a Rust binary — it never executes Python code, so GDAL and the full
# uv sync are unnecessary. The ruff wheel installs in ~3 seconds.
# Note: the official ruff Docker image is distroless (no shell), so GitLab CI
# cannot execute scripts in it — a slim Python image is used instead.
linting:
  stage: "lint"
  image: "python:3.13-slim"
  needs: []  # start immediately without waiting for the prepare stage
  # Nightly rebuilds the prod image from an existing tag — the code is unchanged,
  # so linting it again adds nothing. Skip on the schedule.
  rules:
    - if: "$CI_PIPELINE_SOURCE != 'schedule'"
  # Version pinned deliberately: an unpinned `pip install ruff` installs whatever
  # is current, so a new ruff release breaks the pipeline on unchanged code. This
  # happened with 0.16.0, which expanded the default rule set from 59 to 413
  # rules. Keep in sync with pyproject.toml and .pre-commit-config.yaml.
  script:
    - "pip install --quiet ruff==0.16.0"
    - "ruff check ."

# Unit tests: no external services needed.
# Only files confirmed to work without DB/Redis/MinIO are listed here.
# Add new service-free test files to this list as they are created.
test-unit:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:latest"
  # Nightly rebuilds an existing tag's code in the CI image — these unit tests
  # don't exercise the freshly-built prod image, so they add nothing here. Skip
  # on the schedule (deps are pinned; this is the real protection).
  rules:
    - if: "$CI_PIPELINE_SOURCE != 'schedule'"
  before_script:
    - "cp env_test .env"
    - "mkdir -p test/artifacts"
  script:
    - >
      python -m pytest
      test/test_env.py
      test/test_html_id_enforcement.py
      test/test_sensor_routing_descriptions.py
      test/test_osm_transform.py
      --no-services -v
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

# Integration tests: full services + Playwright. Runs in parallel with test-unit.
# No package installation needed — everything is baked into the CI image.
# Restricted to main and merge requests — the full E2E workflow (OSM download,
# route computation) takes 8–12 min and adds no value on every feature branch push.
# Unit tests catch regressions there; integration tests gate merges.
test-integration:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:latest"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - when: "never"
  services:
    - name: "postgis/postgis:latest"
      alias: "postgres"
      variables:
        POSTGRES_DB: cosmonaut_db
        POSTGRES_USER: cosmonaut
        POSTGRES_PASSWORD: password
    - name: "minio/minio:latest"
      alias: "minio"
      command: ["server", "/data", "--console-address", ":9001"]
      variables:
        MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY}"
        MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY}"
    - name: "redis:latest"
      alias: "redis"
  before_script:
    # Wait for PostgreSQL to be ready
    - "until pg_isready -h postgres -p 5432 -U cosmonaut; do echo 'Waiting for PostgreSQL...'; sleep 2; done"
    # Initialize database schema
    - "PGPASSWORD=password psql -h postgres -U cosmonaut -d cosmonaut_db -f docker/init.sql"
    # Wait for MinIO to be ready
    - "until curl -sf http://minio:9000/minio/health/ready; do echo 'Waiting for MinIO...'; sleep 2; done"
    - "cp env_test .env"
    # Create MinIO bucket
    - "source .env && rclone config create minio s3 provider=Minio access_key_id=${OBJECT_STORAGE_ACCESS_KEY} secret_access_key=${OBJECT_STORAGE_SECRET_KEY} endpoint=${OBJECT_STORAGE_HOST}"
    - "source .env && rclone mkdir minio:${OBJECT_STORAGE_BUCKET}"
    - "mkdir -p test/artifacts"
  script:
    - "python -m pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts"
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

# Nightly live-Overpass smoke test: same as test-integration but hits the real
# Overpass API instead of using cached fixtures. Catches contract regressions
# between the local osmnx/Overpass integration. Runs on a daily schedule.
test-integration-live-osm:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:latest"
  rules:
    - if: "$OSM_TEST_SCHEDULE == '1'"
    - when: "never"
  services:
    - name: "postgis/postgis:latest"
      alias: "postgres"
      variables:
        POSTGRES_DB: cosmonaut_db
        POSTGRES_USER: cosmonaut
        POSTGRES_PASSWORD: password
    - name: "minio/minio:latest"
      alias: "minio"
      command: ["server", "/data", "--console-address", ":9001"]
      variables:
        MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY}"
        MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_KEY}"
    - name: "redis:latest"
      alias: "redis"
  variables:
    # Disables BOTH test seams: the in-process osm_cache_patch and the
    # overpass_stub that otherwise points the Celery worker at a committed
    # fixture. Without it this job would be served that fixture and would prove
    # nothing about the live contract.
    # To test a specific endpoint (e.g. the UFZ Overpass instead of the public
    # one), set OVERPASS_URL as a CI variable — the worker inherits it and
    # conftest leaves it alone. The job log names the endpoint it used.
    SKIP_OSM_CACHE: "1"
  before_script:
    # Wait for PostgreSQL to be ready
    - "until pg_isready -h postgres -p 5432 -U cosmonaut; do echo 'Waiting for PostgreSQL...'; sleep 2; done"
    # Initialize database schema
    - "PGPASSWORD=password psql -h postgres -U cosmonaut -d cosmonaut_db -f docker/init.sql"
    # Wait for MinIO to be ready
    - "until curl -sf http://minio:9000/minio/health/ready; do echo 'Waiting for MinIO...'; sleep 2; done"
    - "cp env_test .env"
    # Create MinIO bucket
    - "source .env && rclone config create minio s3 provider=Minio access_key_id=${OBJECT_STORAGE_ACCESS_KEY} secret_access_key=${OBJECT_STORAGE_SECRET_KEY} endpoint=${OBJECT_STORAGE_HOST}"
    - "source .env && rclone mkdir minio:${OBJECT_STORAGE_BUCKET}"
    - "mkdir -p test/artifacts"
  script:
    - "python -m pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts"
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:latest -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:latest -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - when: "never"

build-release:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq"
  script:
    - "docker build -t ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG} -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build -t ${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_TAG} -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
    - yq -i ".frontend.image.tag = \"${CI_COMMIT_TAG}\"" deployment/ufz/prod/values.yaml
    - yq -i ".worker.image.tag = \"${CI_COMMIT_TAG}\"" deployment/ufz/prod/values.yaml
  artifacts:
    paths:
      - "deployment/ufz/prod/values.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"

# builds a fresh Docker-Image from the most recent Git-Tag und postfixes the current date
# e.g. <IMAGE>:<TAG> becomes <IMAGE>:<TAG>-YYYY.MM.DD
build-latest-tag:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq git"
    - "git fetch"
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "git fetch origin ${GIT_LATEST_TAG}"
    - "git checkout ${GIT_LATEST_TAG}"
  script:
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "calver=$(date +'%Y.%m.%d')"
    - 'docker build -t "${CI_REGISTRY_IMAGE}/frontend:${GIT_LATEST_TAG}-${calver}" -f docker/prod.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/frontend"'
    - 'docker build -t "${CI_REGISTRY_IMAGE}/worker:${GIT_LATEST_TAG}-${calver}" -f docker/worker.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/worker"'
    - yq -i ".frontend.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployment/ufz/prod/values.yaml
    - yq -i ".worker.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployment/ufz/prod/values.yaml
  artifacts:
    paths:
      - "deployment/ufz/prod/values.yaml"
  rules:
    - if: "$NIGHTLY_BUILD == '1'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"

# preparation for git - so that the job "bump_version_for_cluster"
.prepare: &prepare
  - "apt-get update -y && apt-get install git openssh-client -yqq"
  - "eval $(ssh-agent -s)"
  - 'echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -'
  - "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
  - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - "git config --global user.email '${GITLAB_USER_EMAIL}'"
  - "git config --global user.name '${GITLAB_USER_LOGIN}'"
  - "git config pull.rebase true"
  - "git remote set-url --push origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}"

bump_version_for_cluster:
  stage: "deploy"
  variables:
    BRANCH: "main"
  script:
    - *prepare
    # Version lives in three places; the tag is the source, so write the other two here.
    # Guarded: on a non-tag run CI_COMMIT_TAG is empty and an unguarded sed would blank them.
    - 'if [ -n "${CI_COMMIT_TAG}" ]; then sed -i "s/^version = .*/version = \"${CI_COMMIT_TAG}\"/" pyproject.toml; fi'
    - 'if [ -n "${CI_COMMIT_TAG}" ]; then sed -i "s/^version: .*/version: \"${CI_COMMIT_TAG}\"/; s/^date-released: .*/date-released: \"$(date -I)\"/" CITATION.cff; fi'
    - "git add deployment/ufz/prod/values.yaml pyproject.toml CITATION.cff"
    - "git commit -m 'automatically increased tag-version for cluster-deployment'"
    - "git pull origin ${BRANCH} --strategy-option=ours"
    - "git push origin HEAD:$BRANCH -o ci.skip"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
    - if: "$NIGHTLY_BUILD == '1'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"
