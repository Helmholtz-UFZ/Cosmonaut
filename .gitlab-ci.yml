stages:
  - "prepare"
  - "lint"
  - "test"
  - "build"
  - "deploy"

include:
  # The S3 server for the integration jobs. Keep ref on the tag pyproject.toml pins.
  - project: "ufz/tb5-smm/met/wg7/cosmo-ecosystem"
    ref: "v0.10.0"
    file: "/ci/object-storage.gitlab-ci.yml"

variables:
  # Postgres. POSTGRES_DB/USER/PASSWORD configure the service image; the app reads
  # the same names (they were POSTGRES_NAME/… before the cosmo_ecosystem integration —
  # the framework's name won, which collapsed the former duplicate pair into one).
  POSTGRES_DB: cosmonaut_db
  POSTGRES_USER: cosmonaut
  POSTGRES_PASSWORD: password
  POSTGRES_HOST_NAME: postgres
  POSTGRES_PORT: "5432"
  # Object storage (ci/object-storage.gitlab-ci.yml in cosmo-ecosystem)
  OBJECT_STORAGE_ACCESS_KEY: accesskey
  OBJECT_STORAGE_SECRET_KEY: secretkey
  # App config
  WEB_WORK_DIR: "./cosmonaut_app/work_dir"
  FLASK_PORT: "8080"
  REDIS_PORT: "6379"
  REDIS_HOST: "redis"
  DOCKER_UID: "1000"
  DOCKER_GID: "1000"
  GUNICORN: "0"
  FLASK_DEBUG: "0"
  # Enable BuildKit for better Docker layer caching
  DOCKER_BUILDKIT: "1"
  # Tag of the CI image the test jobs run in. main always uses `latest`; a branch
  # whose changes touch the CI image inputs gets its own tag (set per job through
  # rules:variables) so it cannot overwrite main's ci:latest.
  CI_IMAGE_TAG: "latest"

.docker_login: &docker_login
  - 'echo "${CI_REGISTRY_PASSWORD}" | docker login --username "$CI_REGISTRY_USER" --password-stdin "${CI_REGISTRY}"'

.base_before_build_script:
  image: "docker:29-cli"
  services:
    - "docker:29-dind"
  tags:
    - "hifis"

# Rebuilds the CI image only when its inputs change (ci.Dockerfile, pyproject.toml,
# uv.lock) — on main and on branches alike; otherwise the test jobs reuse the
# existing ci:latest.
# main pushes the result as ci:latest. A branch pushes ci:<branch-slug> instead, and
# that branch's test jobs pick it up via CI_IMAGE_TAG (see their rules), so a branch
# never overwrites main's image. Branch changes are compared against main
# (compare_to), otherwise a new branch would count every file as changed.
# --build-arg BUILDKIT_INLINE_CACHE=1 embeds cache metadata in the pushed image
# so future --cache-from runs get proper layer hits.
.ci_image_changes: &ci_image_changes
  paths:
    - docker/ci.Dockerfile
    - pyproject.toml
    - uv.lock
  compare_to: "refs/heads/main"

build-ci-image:
  stage: "prepare"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    - docker pull "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}" || docker pull "${CI_REGISTRY_IMAGE}/ci:latest" || true
    - >
      docker build
      --cache-from "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}"
      --cache-from "${CI_REGISTRY_IMAGE}/ci:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}"
      -f docker/ci.Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}"
  rules:
    # Nightly rebuild ships prod images from scratch — it doesn't use ci:latest,
    # so don't rebuild the CI image on the schedule.
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
      when: "never"
    # main: no compare_to (it would diff main against itself); default tag `latest`.
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        paths:
          - docker/ci.Dockerfile
          - pyproject.toml
          - uv.lock
    - changes: *ci_image_changes
      variables:
        CI_IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
    - when: "never"

# Ruff is a Rust binary — it never executes Python code, so GDAL and the full
# uv sync are unnecessary. The ruff wheel installs in ~3 seconds.
# Note: the official ruff Docker image is distroless (no shell), so GitLab CI
# cannot execute scripts in it — a slim Python image is used instead.
linting:
  stage: "lint"
  image: "python:3.13-slim"
  needs: []  # start immediately without waiting for the prepare stage
  # Nightly rebuilds the prod image from an existing tag — the code is unchanged,
  # so linting it again adds nothing. Skip on the schedule.
  rules:
    - if: "$CI_PIPELINE_SOURCE != 'schedule'"
  # Version pinned deliberately: an unpinned `pip install ruff` installs whatever
  # is current, so a new ruff release breaks the pipeline on unchanged code. This
  # happened with 0.16.0, which expanded the default rule set from 59 to 413
  # rules. Keep in sync with pyproject.toml and .pre-commit-config.yaml.
  script:
    - "pip install --quiet ruff==0.16.0"
    - "ruff check ."
    # Unpinned images move silently (titiler:latest went to 2.x). Every `image:` in the
    # compose files needs an explicit tag, written plainly: no `:latest`, no quotes, no
    # trailing comment. Services with a `build:` key are skipped, since their `image:`
    # only names the locally built image. Plain line scan, no YAML parser: the python
    # image has none, and compose service keys sit at a fixed two-space indent.
    - |
      python3 - <<'EOF'
      import glob
      import re
      import sys

      problems = []
      for path in sorted(glob.glob("docker-compose*.yml")):
          service = None
          images = {}  # service -> (line number, raw value)
          built = set()  # services with a build: key
          for number, line in enumerate(open(path), start=1):
              if re.match(r"\S", line) and not line.startswith("#"):
                  service = None  # a new top-level key ends the services block
              match = re.match(r"  ([\w.-]+):\s*$", line)
              if match:
                  service = match.group(1)
              if service is None:
                  continue
              if re.match(r"    build:", line):
                  built.add(service)
              match = re.match(r"    image:\s*(.*?)\s*$", line)
              if match:
                  images[service] = (number, match.group(1))
          for service, (number, value) in images.items():
              if service in built:
                  continue
              if "#" in value or '"' in value or "'" in value:
                  problem = "quoted image or trailing comment"
              else:
                  # A tag is a colon in the last path segment: host:5000/img has none.
                  name, _, tag = value.rpartition("/")[2].partition(":")
                  if not tag:
                      problem = "no tag"
                  elif tag == "latest":
                      problem = ":latest"
                  else:
                      continue
              problems.append(f"{path}:{number}: {service}: {value!r}: {problem}")

      print("\n".join(problems) or "all compose images are pinned")
      sys.exit(bool(problems))
      EOF

# Unit tests: no external services needed.
# Only files confirmed to work without DB/Redis/object storage are listed here.
# Add new service-free test files to this list as they are created.
test-unit:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}"
  # Nightly rebuilds an existing tag's code in the CI image — these unit tests
  # don't exercise the freshly-built prod image, so they add nothing here. Skip
  # on the schedule (deps are pinned; this is the real protection).
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
      when: "never"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    # Branch rebuilt the CI image: use its own tag (see build-ci-image).
    - changes: *ci_image_changes
      variables:
        CI_IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
    - when: "on_success"
  before_script:
    - "cp env_test .env"
    - "mkdir -p test/artifacts"
  script:
    - >
      python -m pytest
      test/test_env.py
      test/test_html_id_enforcement.py
      test/test_sensor_routing_descriptions.py
      test/test_osm_transform.py
      test/test_error_handling.py
      test/test_no_threads_in_app.py
      test/test_osm_tile_referrer.py
      --no-services -v
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

# Integration tests: full services + Playwright. Runs in parallel with test-unit.
# No package installation needed — everything is baked into the CI image.
# Restricted to main and merge requests — the full E2E workflow (OSM download,
# route computation) takes 8–12 min and adds no value on every feature branch push.
# Unit tests catch regressions there; integration tests gate merges.
test-integration:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:${CI_IMAGE_TAG}"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
      changes: *ci_image_changes
      variables:
        CI_IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - when: "never"
  services:
    - name: "postgis/postgis:latest"
      alias: "postgres"
      variables:
        POSTGRES_DB: cosmonaut_db
        POSTGRES_USER: cosmonaut
        POSTGRES_PASSWORD: password
    - !reference [.cosmo-ecosystem-object-storage, services]
    - name: "redis:latest"
      alias: "redis"
  before_script:
    # Wait for PostgreSQL to be ready
    - "until pg_isready -h postgres -p 5432 -U cosmonaut; do echo 'Waiting for PostgreSQL...'; sleep 2; done"
    # Initialize database schema
    - "PGPASSWORD=password psql -h postgres -U cosmonaut -d cosmonaut_db -f docker/init.sql"
    - !reference [.cosmo-ecosystem-object-storage, before_script]
    - "cp env_test .env"
    # No rclone setup here: conftest runs setup_remote() and create_bucket().
    - "mkdir -p test/artifacts"
  script:
    - "python -m pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts"
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

# Nightly live-Overpass smoke test: same as test-integration but hits the real
# Overpass API instead of using cached fixtures. Catches contract regressions
# between the local osmnx/Overpass integration. Runs on a daily schedule.
test-integration-live-osm:
  stage: "test"
  image: "${CI_REGISTRY_IMAGE}/ci:latest"
  rules:
    - if: "$OSM_TEST_SCHEDULE == '1'"
    - when: "never"
  services:
    - name: "postgis/postgis:latest"
      alias: "postgres"
      variables:
        POSTGRES_DB: cosmonaut_db
        POSTGRES_USER: cosmonaut
        POSTGRES_PASSWORD: password
    - !reference [.cosmo-ecosystem-object-storage, services]
    - name: "redis:latest"
      alias: "redis"
  variables:
    # Disables BOTH test seams: the in-process osm_cache_patch and the
    # overpass_stub that otherwise points the Celery worker at a committed
    # fixture. Without it this job would be served that fixture and would prove
    # nothing about the live contract.
    # To test a specific endpoint (e.g. the UFZ Overpass instead of the public
    # one), set OVERPASS_URL as a CI variable — it beats env_test's value (load_dotenv
    # does not override), the worker inherits it and conftest leaves it alone. The job log names the endpoint it used.
    SKIP_OSM_CACHE: "1"
  before_script:
    # Wait for PostgreSQL to be ready
    - "until pg_isready -h postgres -p 5432 -U cosmonaut; do echo 'Waiting for PostgreSQL...'; sleep 2; done"
    # Initialize database schema
    - "PGPASSWORD=password psql -h postgres -U cosmonaut -d cosmonaut_db -f docker/init.sql"
    - !reference [.cosmo-ecosystem-object-storage, before_script]
    - "cp env_test .env"
    # No rclone setup here: conftest runs setup_remote() and create_bucket().
    - "mkdir -p test/artifacts"
  script:
    - "python -m pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts"
  artifacts:
    when: on_failure
    paths:
      - test/artifacts/
    expire_in: 7 days

build-latest:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
  script:
    # Layer cache from the previous :latest (inline cache metadata, see build-ci-image).
    # Release builds (build-release, build-latest-tag) deliberately do NOT use this.
    - "docker pull ${CI_REGISTRY_IMAGE}/frontend:latest || true"
    - "docker pull ${CI_REGISTRY_IMAGE}/worker:latest || true"
    - >
      docker build
      --cache-from ${CI_REGISTRY_IMAGE}/frontend:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t ${CI_REGISTRY_IMAGE}/frontend:latest -f docker/prod.Dockerfile .
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - >
      docker build
      --cache-from ${CI_REGISTRY_IMAGE}/worker:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t ${CI_REGISTRY_IMAGE}/worker:latest -f docker/worker.Dockerfile .
    # Worker-image smoke test, run against the image just built, before it is
    # pushed. It runs the CMD's setup_remote() step only, derived from the image's
    # own CMD rather than copied — a copy would stay green even after the CMD
    # bends, which is exactly the failure this guards against. See
    # docs/conventions/worker_image.md (cosmo-ecosystem) for the full rationale: this
    # is the test that would have caught the two-week rclone outage.
    # env_test, not a dedicated env_ci: it already carries dummy credentials for
    # every var config.py reads, and is already used by the test jobs above.
    # `docker run --env-file`, unlike compose, keeps the quotes around a value —
    # strip them so config.py reads ./cosmonaut_app/work_dir and not
    # "./cosmonaut_app/work_dir".
    - tr -d '"' < env_test > /tmp/smoke.env
    - |
      CMD_STR=$(docker inspect --format '{{index .Config.Cmd 2}}' "${CI_REGISTRY_IMAGE}/worker:latest")
      case "$CMD_STR" in
        *"exec celery"*) ;;
        *) echo "CMD has no 'exec celery' marker — this job cannot find the setup step."; exit 1 ;;
      esac
      docker run --rm --env-file /tmp/smoke.env --entrypoint sh "${CI_REGISTRY_IMAGE}/worker:latest" \
        -c "${CMD_STR%%exec celery*} true"
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - when: "never"

build-release:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq"
  script:
    # --pull --no-cache: releases are built fresh so base-image/OS security updates land at every tag.
    - "docker build --pull --no-cache -t ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_TAG} -f docker/prod.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/frontend"
    - "docker build --pull --no-cache -t ${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_TAG} -f docker/worker.Dockerfile ."
    - "docker push --all-tags ${CI_REGISTRY_IMAGE}/worker"
    - yq -i ".frontend.image.tag = \"${CI_COMMIT_TAG}\"" deployment/ufz/prod/values.yaml
    - yq -i ".worker.image.tag = \"${CI_COMMIT_TAG}\"" deployment/ufz/prod/values.yaml
  artifacts:
    paths:
      - "deployment/ufz/prod/values.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
      when: "always"
    - when: "never"

# builds a fresh Docker-Image from the most recent Git-Tag und postfixes the current date
# e.g. <IMAGE>:<TAG> becomes <IMAGE>:<TAG>-YYYY.MM.DD
build-latest-tag:
  stage: "build"
  extends: ".base_before_build_script"
  before_script:
    - *docker_login
    - "apk update && apk add --no-cache jq yq git"
    - "git fetch"
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "git fetch origin ${GIT_LATEST_TAG}"
    - "git checkout ${GIT_LATEST_TAG}"
  script:
    - "GIT_LATEST_TAG=$(git describe --tags --abbrev=0)"
    - "calver=$(date +'%Y.%m.%d')"
    # --pull --no-cache: the nightly rebuild exists to pick up security updates, so never reuse layers.
    - 'docker build --pull --no-cache -t "${CI_REGISTRY_IMAGE}/frontend:${GIT_LATEST_TAG}-${calver}" -f docker/prod.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/frontend"'
    - 'docker build --pull --no-cache -t "${CI_REGISTRY_IMAGE}/worker:${GIT_LATEST_TAG}-${calver}" -f docker/worker.Dockerfile .'
    - 'docker push --all-tags "${CI_REGISTRY_IMAGE}/worker"'
    - yq -i ".frontend.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployment/ufz/prod/values.yaml
    - yq -i ".worker.image.tag = \"${GIT_LATEST_TAG}-${calver}\"" deployment/ufz/prod/values.yaml
  artifacts:
    paths:
      - "deployment/ufz/prod/values.yaml"
  rules:
    # A release pipeline (VERSION set) owns the version files and the tag it
    # pushes; this job must not also fire, or it would build a stray image and
    # overwrite values.yaml from the previous tag.
    - if: "$VERSION"
      when: "never"
    - if: "$NIGHTLY_BUILD == '1'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"

# preparation for git - so that the job "bump_version_for_cluster"
.prepare: &prepare
  - "apt-get update -y && apt-get install git openssh-client -yqq"
  - "eval $(ssh-agent -s)"
  - 'echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -'
  - "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
  - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - "git config --global user.email '${GITLAB_USER_EMAIL}'"
  - "git config --global user.name '${GITLAB_USER_LOGIN}'"
  - "git config pull.rebase true"
  - "git remote set-url --push origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}"

bump_version_for_cluster:
  stage: "deploy"
  variables:
    BRANCH: "main"
  script:
    - *prepare
    # Version lives in three places; the tag is the source, so write the other two here.
    # Guarded: on a non-tag run CI_COMMIT_TAG is empty and an unguarded sed would blank them.
    - 'if [ -n "${CI_COMMIT_TAG}" ]; then sed -i "s/^version = .*/version = \"${CI_COMMIT_TAG}\"/" pyproject.toml; fi'
    - 'if [ -n "${CI_COMMIT_TAG}" ]; then sed -i "s/^version: .*/version: \"${CI_COMMIT_TAG}\"/; s/^date-released: .*/date-released: \"$(date -I)\"/" CITATION.cff; fi'
    - "git add deployment/ufz/prod/values.yaml pyproject.toml CITATION.cff"
    - "git commit -m 'automatically increased tag-version for cluster-deployment'"
    - "git pull origin ${BRANCH} --strategy-option=ours"
    - "git push origin HEAD:$BRANCH -o ci.skip"
  rules:
    # A release pipeline (VERSION set) owns the version files and the tag it
    # pushes; this job must not also fire, or it would build a stray image and
    # overwrite values.yaml from the previous tag.
    - if: "$VERSION"
      when: "never"
    - if: '$CI_COMMIT_TAG =~ /^\d+.\d+.\d+/'
    - if: "$NIGHTLY_BUILD == '1'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"
    - when: "never"

# ─── Release ──────────────────────────────────────────────────────────────────
# Cut a release in one action: write the version into every file that must carry
# it, commit, tag THAT commit, push both.
#
# How to run: Build → Pipelines → Run pipeline, on main, with variable
#   VERSION = 0.3.6
#
# Why the version is written BEFORE the tag and not after: Zenodo archives the
# tagged snapshot, so a job that writes CITATION.cff after the tag mints the
# PREVIOUS version into the DOI record. Measured, not theoretical — the
# framework's v0.4.0 carries no CITATION.cff at all for exactly this reason.
#
# Pushing the tag is what triggers build-release and bump_version_for_cluster,
# which own the image build and deployment/values.yaml. This job deliberately
# does not touch values.yaml.
release:
  stage: "deploy"
  image: "python:3.13"
  variables:
    BRANCH: "main"
  script:
    - *prepare
    - 'echo "$VERSION" | grep -qE "^[0-9]+\\.[0-9]+\\.[0-9]+$" || { echo "VERSION must be X.Y.Z, got: $VERSION"; exit 1; }'
    - "git fetch --tags origin"
    - 'if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then echo "Tag $VERSION already exists — choose another version"; exit 1; fi'
    # detached HEAD in CI: create the local branch from the remote in one step
    - "git checkout -B $BRANCH origin/$BRANCH"
    - 'sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml'
    - 'sed -i "s/^version: .*/version: \"${VERSION}\"/; s/^date-released: .*/date-released: \"$(date -I)\"/" CITATION.cff'
    - 'git diff --quiet && { echo "Nothing changed — is VERSION already the current one?"; exit 1; } || true'
    # Fourth place the version lives. cosmopolitan asserts it against
    # pyproject.toml in test_documentation_version, so leaving it behind breaks
    # the release commit's own suite; cosmonaut has no such test and would
    # instead ship documentation quietly claiming the previous version.
    - 'echo "${VERSION}" > cosmonaut_app/assets/docs/doc_version.txt'
    # uv.lock records the project's own version as well. Without this the
    # release leaves it one version behind, and every local `uv run` afterwards
    # rewrites that line. Written directly, not via `uv lock`: locking re-resolves,
    # which builds gdal from source for its metadata, and this image has no GDAL
    # headers (release 0.3.12 failed on exactly that). The grep fails the job if
    # the line was not found, so the lockfile cannot drift silently.
    - 'sed -i "/^name = \"cosmonaut\"$/{n;s/^version = .*/version = \"${VERSION}\"/}" uv.lock'
    - 'grep -A1 "^name = \"cosmonaut\"$" uv.lock | grep -qx "version = \"${VERSION}\"" || { echo "uv.lock: project version not updated"; exit 1; }'
    - "git add pyproject.toml CITATION.cff cosmonaut_app/assets/docs/doc_version.txt uv.lock"
    - 'git commit -m "Release ${VERSION}"'
    - 'git tag -a "$VERSION" -m "Release ${VERSION}"'
    # Branch first, with ci.skip: the release commit itself needs no pipeline.
    - "git push origin HEAD:$BRANCH -o ci.skip"
    # The tag push is the trigger for build-release + bump_version_for_cluster.
    - 'git push origin "$VERSION"'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $VERSION'
    - when: "never"
