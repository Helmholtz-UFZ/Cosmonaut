repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version. Keep in sync with pyproject.toml and .gitlab-ci.yml.
  rev: v0.16.0
  hooks:
    - id: ruff-format
      types_or: [ python, pyi ]
    - id: ruff
      types_or: [ python, pyi ]
      args: [ --fix ]
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.21.2
  hooks:
    # Blocks commits that add a secret; same idea as the Secret Detection CI job.
    - id: gitleaks
